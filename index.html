<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>とむらい | 死後手続きチェックリスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F5F3ED;
    --paper-deep:#EFEBE1;
    --ink:#232922;
    --green:#2B5545;
    --green-soft:#6E8B7C;
    --line:#DCD8CC;
    --urgent:#9C4A2E;
    --muted:#5C5850;
    --white:#FFFFFF;
    --warm:#8B6F4E;
    --warm-paper:#F4EDE3;
    --warm-line:#E3D5C2;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans',-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic UI','Yu Gothic','Meiryo UI',Meiryo,sans-serif;
    font-weight:300;
    font-size:17px;
    line-height:1.85;
    -webkit-font-smoothing:antialiased;
    line-break:strict;
    word-break:normal;
    overflow-wrap:break-word;
  }
  .wrap{
    max-width:640px;
    margin:0 auto;
    padding:56px 24px 120px;
    min-height:100vh;
  }
  h1,h2,h3{
    font-family:'Noto Sans',-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic UI','Yu Gothic','Meiryo UI',Meiryo,sans-serif;
    font-weight:700;
    margin:0;
  }
  .enso-holder{
    display:flex;
    justify-content:center;
    margin-bottom:36px;
  }

  /* ---- INTRO ---- */
  .intro-mark{
    font-family:'Noto Sans',-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic UI','Yu Gothic','Meiryo UI',Meiryo,sans-serif;
    font-weight:600;
    font-size:15px;
    letter-spacing:0.3em;
    color:var(--green-soft);
    text-align:center;
    margin-bottom:28px;
  }
  .intro h1{
    font-size:30px;
    text-align:center;
    line-height:1.65;
    color:var(--ink);
    max-width:440px;
    margin-left:auto;
    margin-right:auto;
  }
  .intro .lead{
    text-align:center;
    color:var(--muted);
    font-weight:400;
    font-size:16px;
    margin-top:20px;
    max-width:460px;
    margin-left:auto;
    margin-right:auto;
  }
  .intro-notes{
    margin-top:44px;
    border-top:1px solid var(--line);
    padding-top:28px;
    display:flex;
    flex-direction:column;
    gap:16px;
    font-size:15px;
    font-weight:400;
    color:var(--muted);
  }
  .intro-notes div{display:flex;gap:12px;}
  .intro-notes .n{
    font-family:'Noto Sans',-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic UI','Yu Gothic','Meiryo UI',Meiryo,sans-serif;
    font-weight:700;
    color:var(--green);
    flex-shrink:0;
  }

  /* ---- BUTTONS ---- */
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    background:var(--green);
    color:var(--white);
    border:none;
    padding:16px 30px;
    font-family:'Noto Sans',-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic UI','Yu Gothic','Meiryo UI',Meiryo,sans-serif;
    font-size:16px;
    letter-spacing:0.06em;
    cursor:pointer;
    border-radius:2px;
    transition:opacity .2s ease, transform .2s ease;
  }
  .btn:hover{opacity:0.88;}
  .btn:active{transform:scale(0.98);}
  .btn:focus-visible{outline:2px solid var(--green); outline-offset:3px;}
  .btn-block{width:100%; margin-top:40px;}
  .legal-links{
    text-align:center;
    margin-top:24px;
    font-size:12.5px;
    color:var(--muted);
  }
  .legal-links a{color:var(--muted); text-decoration:underline; text-underline-offset:3px;}
  .legal-links a:hover{color:var(--green);}
  .legal-dot{margin:0 6px;}
  .btn-ghost{
    background:transparent;
    color:var(--green-soft);
    border:1px solid var(--line);
  }
  .btn-ghost:hover{opacity:1; border-color:var(--green-soft); color:var(--green);}

  /* ---- QUESTION STEP ---- */
  .step-index{
    text-align:center;
    font-family:'Noto Sans',-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic UI','Yu Gothic','Meiryo UI',Meiryo,sans-serif;
    font-weight:600;
    font-size:14px;
    color:var(--green-soft);
    letter-spacing:0.15em;
    margin-bottom:16px;
  }
  .question h2{
    font-size:24px;
    text-align:center;
    line-height:1.75;
    max-width:480px;
    margin:0 auto 10px;
  }
  .question .sub{
    text-align:center;
    font-size:15px;
    font-weight:400;
    color:var(--muted);
    margin-bottom:36px;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .option{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:19px 22px;
    background:var(--white);
    border:1px solid var(--line);
    cursor:pointer;
    font-size:17px;
    transition:border-color .2s ease, background .2s ease;
    border-radius:2px;
  }
  .option:hover{border-color:var(--green-soft);}
  .option.selected{
    border-color:var(--green);
    background:#EFF3EF;
  }
  .option .mark{
    width:16px;height:16px;
    border-radius:50%;
    border:1.5px solid var(--line);
    flex-shrink:0;
    position:relative;
  }
  .option.selected .mark{border-color:var(--green);}
  .option.selected .mark::after{
    content:'';
    position:absolute;
    inset:3px;
    border-radius:50%;
    background:var(--green);
  }
  .step-nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:40px;
  }
  .step-nav .back{
    font-size:15px;
    font-weight:400;
    color:var(--muted);
    background:none;
    border:none;
    cursor:pointer;
    letter-spacing:0.05em;
  }
  .step-nav .back:hover{color:var(--green);}

  /* ---- INFO FORM STEP ---- */
  .info-form{
    display:flex;
    flex-direction:column;
    gap:22px;
  }
  .field label{
    display:block;
    font-size:14px;
    color:var(--green);
    font-weight:600;
    font-family:'Noto Sans',-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic UI','Yu Gothic','Meiryo UI',Meiryo,sans-serif;
    margin-bottom:8px;
  }
  .field .field-note{
    font-size:13px;
    color:var(--muted);
    margin-top:6px;
  }
  .field input[type="date"],
  .field input[type="datetime-local"],
  .field input[type="text"]{
    width:100%;
    padding:14px 16px;
    border:1px solid var(--line);
    background:var(--white);
    font-family:'Noto Sans',-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic UI','Yu Gothic','Meiryo UI',Meiryo,sans-serif;
    font-size:16px;
    color:var(--ink);
    border-radius:2px;
  }
  .field input:focus{outline:2px solid var(--green-soft); outline-offset:1px;}

  /* ---- RESULTS ---- */
  .results-head{text-align:center; margin-bottom:8px;}
  .results-head h2{font-size:27px;}
  .results-sub{
    text-align:center;
    color:var(--muted);
    font-weight:400;
    font-size:15px;
    margin-top:12px;
    margin-bottom:8px;
  }
  .progress-line{
    text-align:center;
    font-size:15px;
    font-weight:600;
    color:var(--green);
    margin-bottom:32px;
    font-family:'Noto Sans',-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic UI','Yu Gothic','Meiryo UI',Meiryo,sans-serif;
  }
  .disclaimer{
    background:var(--paper-deep);
    border-left:3px solid var(--green-soft);
    padding:18px 20px;
    font-size:14.5px;
    font-weight:400;
    color:var(--muted);
    margin-bottom:36px;
    line-height:1.9;
  }
  .encourage-card{
    background:#EFF3EF;
    border:1px solid var(--line);
    border-radius:3px;
    padding:18px 20px;
    margin:24px 0 36px;
    text-align:center;
  }
  .encourage-title{font-size:15.5px; color:var(--ink); margin-bottom:4px;}
  .encourage-sub{font-size:14px; color:var(--muted);}
  .funeral-card{
    background:var(--white);
    border:1px solid var(--line);
    padding:20px 22px;
    margin-bottom:44px;
  }
  .funeral-card h3{
    font-size:15px;
    color:var(--green);
    font-weight:600;
    margin-bottom:14px;
  }
  .funeral-row{
    display:flex;
    gap:14px;
    font-size:15px;
    padding:6px 0;
  }
  .funeral-row .k{
    color:var(--muted);
    width:110px;
    flex-shrink:0;
  }
  .geo-bar{
    text-align:center;
    margin-bottom:36px;
  }
  .btn-geo{width:100%;}
  .geo-ok{
    display:block;
    font-size:14px;
    color:var(--green);
    font-weight:500;
  }
  .geo-note{
    font-size:13px;
    color:var(--muted);
    margin-top:8px;
  }
  .category{margin-bottom:40px;}
  .category-head{
    display:flex;
    align-items:baseline;
    gap:12px;
    border-bottom:1px solid var(--line);
    padding-bottom:10px;
    margin-bottom:18px;
  }
  .category-head h3{font-size:19px; color:var(--ink);}
  .category-head .deadline-tag{
    font-family:'Noto Sans',-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic UI','Yu Gothic','Meiryo UI',Meiryo,sans-serif;
    font-size:13px;
    letter-spacing:0.03em;
    padding:4px 11px;
    border-radius:20px;
    color:var(--white);
    background:var(--green-soft);
  }
  .category-head .deadline-tag.urgent{background:var(--urgent);}
  .category-head .deadline-tag.calm{background:var(--muted);}
  .category-note{
    font-size:14px;
    color:var(--muted);
    margin:-10px 0 16px;
  }
  .item{
    display:flex;
    gap:14px;
    padding:18px 0;
    border-bottom:1px solid var(--line);
    cursor:pointer;
  }
  .item:last-child{border-bottom:none;}
  .item .box{
    width:22px;height:22px;
    border:1.5px solid var(--green-soft);
    border-radius:3px;
    flex-shrink:0;
    margin-top:2px;
    position:relative;
    transition:background .15s ease, border-color .15s ease;
  }
  .item.no-check .box{visibility:hidden;}
  .item.done .box{background:var(--green); border-color:var(--green);}
  .item.done .box::after{
    content:'';
    position:absolute;
    left:6px; top:2px;
    width:6px; height:11px;
    border-right:2px solid var(--white);
    border-bottom:2px solid var(--white);
    transform:rotate(40deg);
  }
  .item .body{flex:1;}
  .item .body h4{
    font-family:'Noto Sans',-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic UI','Yu Gothic','Meiryo UI',Meiryo,sans-serif;
    font-weight:500;
    font-size:18px;
    margin:0 0 6px;
    color:var(--ink);
    transition:color .15s ease, text-decoration .15s ease;
  }
  .item.done .body h4{color:var(--muted); text-decoration:line-through;}
  .item .body p{
    font-size:15.5px;
    font-weight:400;
    color:var(--muted);
    margin:0 0 10px;
    line-height:1.8;
  }
  .item .deadline-small{
    font-size:13.5px;
    color:var(--green);
    font-weight:600;
    font-family:'Noto Sans',-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic UI','Yu Gothic','Meiryo UI',Meiryo,sans-serif;
    margin-bottom:6px;
    display:block;
  }
  .meta-list{
    display:flex;
    flex-direction:column;
    gap:5px;
    font-size:14px;
    background:var(--paper-deep);
    padding:12px 14px;
    border-radius:2px;
  }
  .meta-list .row{display:flex; gap:8px;}
  .meta-list .row .label{
    color:var(--green);
    font-weight:600;
    flex-shrink:0;
    width:64px;
    font-family:'Noto Sans',-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic UI','Yu Gothic','Meiryo UI',Meiryo,sans-serif;
    font-size:12.5px;
    padding-top:1px;
  }
  .meta-list .row .val{color:var(--muted); font-weight:400;}
  .item .link{
    display:inline-block;
    margin-top:10px;
    font-size:14px;
    color:var(--green);
    text-decoration:underline;
    text-underline-offset:3px;
    cursor:pointer;
  }
  .expand{margin-top:12px;}
  .expand .info-form{gap:14px;}
  .expand .field label{font-size:13px; margin-bottom:6px;}
  .expand-toggle{
    background:none;
    border:1px dashed var(--line);
    color:var(--green);
    font-family:'Noto Sans',-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic UI','Yu Gothic','Meiryo UI',Meiryo,sans-serif;
    font-weight:500;
    font-size:14px;
    padding:10px 16px;
    border-radius:2px;
    cursor:pointer;
  }
  .expand-toggle:hover{border-color:var(--green-soft);}
  .later-toggle{margin:8px 0 40px;}
  .btn-block{width:100%;}
  .footer-actions{display:flex; gap:10px; margin-top:20px;}
  .footer-actions .btn{flex:1;}
  .signature{
    margin-top:70px;
    text-align:center;
    font-size:13.5px;
    letter-spacing:0.2em;
    color:var(--muted);
  }

  /* ---- こころのケア入り口リンク ---- */
  .grief-entry{
    display:block;
    text-align:center;
    font-size:14.5px;
    color:var(--warm);
    text-decoration:underline;
    text-underline-offset:3px;
    margin:20px 0 28px;
    cursor:pointer;
    font-family:'Noto Sans',-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic UI','Yu Gothic','Meiryo UI',Meiryo,sans-serif;
  }
  .grief-entry:hover{opacity:0.8;}

  /* ---- こころのケア画面 ---- */
  .grief{max-width:520px; margin:0 auto;}
  .grief-icon-holder{
    display:flex;
    justify-content:center;
    margin-bottom:16px;
  }
  .grief-mark{
    text-align:center;
    font-weight:700;
    letter-spacing:0.1em;
    color:var(--warm);
    font-size:15px;
    margin-bottom:28px;
  }
  .grief-quote{
    background:var(--warm-paper);
    border:1px solid var(--warm-line);
    border-radius:3px;
    padding:28px 26px;
    font-size:18px;
    line-height:2;
    color:var(--ink);
    text-align:center;
    margin-bottom:44px;
  }
  .grief-quote-sign{
    display:inline-block;
    margin-top:10px;
    font-size:13px;
    color:var(--muted);
  }
  .grief-h2{
    text-align:center;
    font-size:19px;
    margin-bottom:22px;
  }
  .mood-row{
    display:flex;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:24px;
  }
  .mood-btn{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:20px;
    padding:11px 20px;
    cursor:pointer;
    font-family:'Noto Sans',-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic UI','Yu Gothic','Meiryo UI',Meiryo,sans-serif;
  }
  .mood-btn:hover{border-color:var(--warm);}
  .mood-btn.selected{border-color:var(--warm); background:var(--warm-paper);}
  .mood-label{font-size:14.5px; color:var(--muted);}
  .mood-btn.selected .mood-label{color:var(--warm); font-weight:600;}
  .grief-note{
    text-align:center;
    font-size:13.5px;
    color:var(--muted);
    line-height:1.8;
    margin:-24px 0 36px;
  }
  .mood-reflection{
    text-align:center;
    font-size:16px;
    line-height:1.9;
    color:var(--ink);
    background:var(--warm-paper);
    border-radius:3px;
    padding:20px 22px;
    margin-bottom:16px;
  }
  .mood-action{
    border:1px solid var(--warm-line);
    border-radius:3px;
    padding:20px 22px;
    margin-bottom:36px;
    text-align:center;
  }
  .mood-action-label{
    font-size:12px;
    color:var(--warm);
    letter-spacing:0.06em;
    margin-bottom:10px;
  }
  .mood-action-icon{
    display:flex;
    justify-content:center;
    margin-bottom:10px;
  }
  .mood-action-title{
    font-size:17px;
    font-weight:700;
    color:var(--ink);
    margin-bottom:8px;
  }
  .mood-action-desc{
    font-size:14px;
    color:var(--muted);
    line-height:1.8;
  }
  .grief-resource{
    font-size:13.5px;
    color:var(--muted);
    text-align:center;
    line-height:1.9;
    border-top:1px solid var(--line);
    padding-top:22px;
  }
  .grief-resource a{color:var(--warm); font-weight:600;}

  /* ---- ホーム画面 ---- */
  .back-home-link{
    display:block;
    font-size:14px;
    color:var(--muted);
    margin-bottom:24px;
    cursor:pointer;
  }
  .back-home-link:hover{color:var(--green);}
  .home-greeting{
    font-size:15px;
    color:var(--muted);
    margin-bottom:18px;
  }
  .progress-card{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:3px;
    padding:24px 22px;
    margin-bottom:40px;
  }
  .progress-card-lead{
    font-size:17px;
    font-weight:700;
    color:var(--ink);
    margin-bottom:18px;
    line-height:1.6;
  }
  .progress-track{
    width:100%;
    height:8px;
    background:var(--paper-deep);
    border-radius:4px;
    overflow:hidden;
    margin-bottom:10px;
  }
  .progress-fill{
    height:100%;
    background:var(--green);
    border-radius:4px;
    transition:width .4s ease;
  }
  .progress-count{
    font-size:13.5px;
    color:var(--muted);
    margin-bottom:20px;
  }
  .home-section-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:14px;
  }
  .home-section-head h3{font-size:17px;}
  .home-see-all{
    background:none;
    border:none;
    color:var(--green);
    font-size:13.5px;
    cursor:pointer;
    font-family:'Noto Sans',-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic UI','Yu Gothic','Meiryo UI',Meiryo,sans-serif;
  }
  .home-recent{
    border:1px solid var(--line);
    border-radius:3px;
    margin-bottom:36px;
  }
  .home-recent-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    padding:16px 18px;
    border-bottom:1px solid var(--line);
    font-size:15px;
  }
  .home-recent-item:last-child{border-bottom:none;}
  .home-recent-title{color:var(--ink);}
  .home-recent-deadline{
    font-size:12.5px;
    color:var(--green);
    font-weight:600;
    flex-shrink:0;
    white-space:nowrap;
  }
  .home-empty{
    font-size:14.5px;
    color:var(--muted);
    margin-bottom:36px;
  }
  .clear-data-link{
    display:block;
    width:100%;
    background:none;
    border:none;
    text-align:center;
    font-size:12.5px;
    color:var(--muted);
    text-decoration:underline;
    text-underline-offset:3px;
    cursor:pointer;
    padding:8px;
    font-family:'Noto Sans',-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic UI','Yu Gothic','Meiryo UI',Meiryo,sans-serif;
  }
  .clear-data-link:hover{color:var(--urgent);}

  /* ---- タブバー ---- */
  .tab-bar{
    display:flex;
    max-width:640px;
    margin:0 auto 32px;
    border-bottom:1px solid var(--line);
  }
  .tab-btn{
    flex:1;
    background:none;
    border:none;
    border-bottom:2px solid transparent;
    padding:14px 4px;
    font-family:'Noto Sans',-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic UI','Yu Gothic','Meiryo UI',Meiryo,sans-serif;
    font-size:12.5px;
    color:var(--muted);
    cursor:pointer;
    white-space:nowrap;
  }
  .tab-btn.active{color:var(--green); font-weight:700; border-bottom-color:var(--green);}
  .tab-btn:hover{color:var(--green);}

  /* ---- ホーム: カテゴリタイル ---- */
  .home-tiles{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-bottom:36px;

/* ---- この端末への自動保存(アカウント不要) ---- */
const STORAGE_KEY = 'tomurai-progress-v1';

function saveProgress(){
  try{
    const toSave = {
      answers: state.answers,
      info: state.info,
      checked: state.checked,
      mood: state.mood,
      qIndex: state.qIndex,
      screen: (state.screen==='intro' || state.screen==='question') ? state.screen : 'home',
      reminders: state.reminders,
      family: state.family,
      assignments: state.assignments,
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
  }catch(e){ /* 保存できない環境では何もしない */ }
}

function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return false;
    const saved = JSON.parse(raw);
    if(!saved || !saved.answers || Object.keys(saved.answers).length===0) return false;
    state.answers = saved.answers || {};
    state.info = Object.assign({deathDate:'', funeralAt:'', funeralPlace:'', cityName:''}, saved.info || {});
    state.checked = saved.checked || {};
    state.mood = saved.mood || null;
    state.qIndex = saved.qIndex || 0;
    state.screen = (saved.screen==='question') ? 'question' : 'home';
    state.reminders = saved.reminders || {};
    state.family = saved.family || [];
    state.assignments = saved.assignments || {};
    return true;
  }catch(e){ return false; }
}

function clearProgress(){
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
}

/* ---- ensō 円相 SVG ---- */
function enso(progressRatio, size=88){
  const r = size/2 - 6;
  const circumference = 2*Math.PI*r;
  const gapAtFull = circumference*0.06;
  const dash = circumference*Math.min(progressRatio,1) - (progressRatio>0.05? gapAtFull*0.4:0);
  return `
  <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#DCD8CC" stroke-width="2"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#2B5545" stroke-width="2.5"
      stroke-linecap="round"
      stroke-dasharray="${dash} ${circumference}"
      transform="rotate(-90 ${size/2} ${size/2})"
      style="transition: stroke-dasharray .5s ease;"/>
  </svg>`;
}

/* ---- 法要日の計算 ---- */
function addDays(dateStr, days){
  const d = new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate()+days);
  return d;
}
function addYears(dateStr, years){
  const d = new Date(dateStr+'T00:00:00');
  d.setFullYear(d.getFullYear()+years);
  return d;
}
function formatJP(d){
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
}

function reminderWindow(targetDate){
  const today = new Date(); today.setHours(0,0,0,0);
  const diffDays = Math.round((targetDate - today)/86400000);
  return diffDays <= 7 && diffDays >= -14;
}

function getActiveReminder(){
  if(!state.info.deathDate || state.answers.shukyou!=='yes') return null;
  const candidates = [
    {key:'shijuku', date:addDays(state.info.deathDate, 48), label:'四十九日', targetId:'hoyo-shijukunichi'},
    {key:'isshuki', date:addYears(state.info.deathDate, 1), label:'一周忌', targetId:'hoyo-isshuki'},
  ];
  for(const c of candidates){
    if(!reminderWindow(c.date)) continue;
    const r = state.reminders[c.key];
    if(r && r.status==='confirmed') continue;
    if(r && r.status==='dismissed'){
      const days = Math.round((new Date() - new Date(r.dismissedAt+'T00:00:00'))/86400000);
      if(days < 3) continue;
    }
    return c;
  }
  return null;
}

function renderReminderCard(){
  const rem = getActiveReminder();
  if(!rem) return '';
  return `
  <div class="reminder-card">
    <div class="reminder-text">${rem.label}が近づいています。</div>
    <div class="reminder-sub">必要であれば、準備することを一緒に確認できます。</div>
    <div class="reminder-actions">

      <button class="btn btn-ghost" id="reminder-dismiss" data-k="${rem.key}">今はしない</button>
    </div>
  </div>`;
}

      memo:'家族や葬儀社に、どの形式で行うかを早めに確認しておくと安心です。'

  ];
  return items.map(it=>{
    let deadline = it.days!=null ? `目安: 逝去から${it.days+1}日目` : '目安: 逝去から1年後';
    let desc = '仏式での法要の目安です。';
    if(hasDate){
      const d = it.years ? addYears(state.info.deathDate, it.years) : addDays(state.info.deathDate, it.days);
      deadline = formatJP(d) + ' ごろ';
      desc += ` 数え方は地域や宗派によって前後する場合があります。`;
    } else {
      desc += ' 逝去日を入力すると、目安の日付を計算します。';
    }
    return {
      id:'hoyo-'+it.key, cat:'hoyo', noCheck:true,
      title:it.title, deadline, desc,
      contact:'菩提寺・葬儀社', documents:'なし', memo:it.note
    };
  });
}

function timeGreeting(){
  const h = new Date().getHours();
  if(h < 5) return 'こんばんは';
  if(h < 11) return 'おはようございます';
  if(h < 18) return 'こんにちは';
  return 'こんばんは';
}
function daysSince(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const today = new Date();
  today.setHours(0,0,0,0);
  return Math.max(0, Math.round((today-d)/86400000));
}

  CATEGORIES.forEach(c=>grouped[c.id]=[]);

  return grouped;
}

          if(e.target.tagName==='A' || e.target.closest('.expand')) return;
          state.checked[it.id] = !state.checked[it.id];
          render();
        };
      } else {
        row.style.cursor='default';
      }
      itemsHolder.appendChild(row);

      const funeralToggle = row.querySelector('#funeral-toggle');
      if(funeralToggle){ funeralToggle.onclick = (e)=>{ e.stopPropagation(); state.ui.funeralOpen=true; render(); }; }
      const fFuneral = row.querySelector('#f-funeral');
      if(fFuneral){ fFuneral.addEventListener('change', e=>{ state.info.funeralAt = e.target.value; }); fFuneral.addEventListener('click', e=>e.stopPropagation()); }
      const fPlace = row.querySelector('#f-place');
      if(fPlace){ fPlace.addEventListener('change', e=>{ state.info.funeralPlace = e.target.value; }); fPlace.addEventListener('click', e=>e.stopPropagation()); }

      const cityToggle = row.querySelector('#city-toggle');
      if(cityToggle){ cityToggle.onclick = (e)=>{ e.stopPropagation(); state.ui.cityOpen=true; render(); }; }
      const fCity = row.querySelector('#f-city');
      if(fCity){ fCity.addEventListener('change', e=>{ state.info.cityName = e.target.value; render(); }); fCity.addEventListener('click', e=>e.stopPropagation()); }

      const expertJump = row.querySelector('.expert-jump');
      if(expertJump){
        expertJump.onclick = (e)=>{
          e.stopPropagation();
          const k = expertJump.getAttribute('data-expert-key');
          state.expertJumpTo = k;
          state.screen = 'experts';
          render();
          track('expert_jump', {category:k});
        };
      }
    });
    targetHolder.appendChild(block);
  });

  const showAllBtn = document.getElementById('show-all-btn');
  if(showAllBtn){ showAllBtn.onclick = ()=>{ state.ui.showAll = true; render(); }; }

  document.getElementById('print-btn').onclick = ()=>window.print();
  document.getElementById('restart-btn').onclick = ()=>{
    clearProgress();
    state = {screen:'intro', qIndex:0, answers:{}, info:{deathDate:'', funeralAt:'', funeralPlace:'', cityName:''}, checked:{}, geo:null, geoStatus:'idle', ui:{funeralOpen:false, cityOpen:false, showAll:false}, mood:null, expertJumpTo:null};
    render();
  };
}

loadProgress();
render();
</script>
</body>
</html>
