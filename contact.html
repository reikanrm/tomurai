<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お問い合わせ | とむらい</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F5F3ED;
    --paper-deep:#EFEBE1;
    --ink:#232922;
    --green:#2B5545;
    --green-soft:#6E8B7C;
    --line:#DCD8CC;
    --muted:#5C5850;
    --white:#FFFFFF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans',-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic UI','Yu Gothic','Meiryo UI',Meiryo,sans-serif;
    font-weight:300;
    font-size:16px;
    line-height:1.9;
  }
  .wrap{max-width:560px; margin:0 auto; padding:56px 24px 100px;}
  a.back{
    display:inline-block;
    color:var(--muted);
    text-decoration:none;
    font-size:14px;
    margin-bottom:32px;
  }
  a.back:hover{color:var(--green);}
  h1{font-size:26px; font-weight:700; margin:0 0 12px;}
  .lead{color:var(--muted); font-size:14.5px; margin-bottom:36px;}
  form{display:flex; flex-direction:column; gap:20px;}
  label{
    display:block;
    font-size:14px;
    color:var(--green);
    font-weight:600;
    margin-bottom:8px;
  }
  input, textarea{
    width:100%;
    padding:13px 14px;
    border:1px solid var(--line);
    background:var(--white);
    font-family:inherit;
    font-size:15px;
    color:var(--ink);
    border-radius:2px;
  }
  input:focus, textarea:focus{outline:2px solid var(--green-soft); outline-offset:1px;}
  textarea{min-height:140px; resize:vertical;}
  button{
    background:var(--green);
    color:var(--white);
    border:none;
    padding:15px;
    font-size:15px;
    font-weight:600;
    border-radius:2px;
    cursor:pointer;
    font-family:inherit;
  }
  button:hover{opacity:0.9;}
  .note{font-size:13px; color:var(--muted); margin-top:20px;}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← とむらいに戻る</a>
  <h1>お問い合わせ</h1>
  <p class="lead">サービスに関するご質問・ご意見は、下のフォームからお送りください。</p>

  <!-- Formspree フォーム(設定済み) -->
  <form action="https://formspree.io/f/xwleovzo" method="POST">
    <div>
      <label for="name">お名前</label>
      <input type="text" id="name" name="name" required>
    </div>
    <div>
      <label for="email">メールアドレス</label>
      <input type="email" id="email" name="email" required>
    </div>
    <div>
      <label for="message">お問い合わせ内容</label>
      <textarea id="message" name="message" required></textarea>
    </div>
    <button type="submit">送信する</button>
  </form>
  <p class="note">送信いただいた内容は、お問い合わせへの対応以外の目的では使用しません。</p>
</div>
</body>
</html>
